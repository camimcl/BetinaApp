# pytest.ini
# Configuração do Pytest para o projeto IntelliBet

[pytest]
# Diretório raiz dos testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Adiciona o projeto ao PYTHONPATH para que os imports funcionem
# (ex: from src.models.predictor import ...)
pythonpath = .

# Opções padrão de execução
addopts =
    -v
    --tb=short
    --no-header
    -q

# Markers registrados (para organização e filtragem)
markers =
    unit: Testes unitários — funções puras, sem dependências externas
    integration: Testes de integração — múltiplas camadas colaborando
    slow: Testes lentos (ex: carrega modelos reais do disco)
